[project]
name = "bcrm-mcp"
version = "0.1.0"
description = "BottleCRM MCP server — connect your AI agent to BottleCRM"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.4", "httpx>=0.28.1", "pydantic>=2.13.4"]

[project.scripts]
bcrm-mcp = "bcrm_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
