# Read the Docs build configuration.
# The docs dependencies live in backend/pyproject.toml's `docs` group so the
# site builds with uv, exactly as CI does, one dependency source, one lockfile.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - cd backend && uv sync --frozen --group docs
    build:
      html:
        - cd backend && uv run mkdocs build --strict -f ../mkdocs.yml -d $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
