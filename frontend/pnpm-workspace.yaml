allowBuilds:
  '@sentry/cli': true
onlyBuiltDependencies:
  - '@sentry/cli'
overrides:
  # GHSA-rgw5-rvv9-x895 (high): DoS via unbounded intermediate arrays.
  # Only reachable through dev tooling (eslint, @sentry/vite-plugin), but the
  # transitive parents still ask for a vulnerable range, so force the patch.
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
  # GHSA-rj75-hqrm-r3gf (moderate): quadratic parsing of flat selectors.
  # Build-time only: @tailwindcss/typography 0.5.20 pins 6.0.10 exactly. 7.0's
  # one breaking change makes insertion during iteration safe; typography only
  # removes nodes from a copied array, and the built CSS is byte-identical.
  'postcss-selector-parser@<7.1.6': '^7.1.6'
